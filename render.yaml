services:
  - type: web
    name: rido-logistics
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        value: https://rido-logistics.onrender.com
      # ⚠️  Set these in Render Dashboard → Environment tab (do NOT hardcode secrets here)
      # JWT_SECRET       → Render Dashboard > Environment
      # MONGODB_URI      → Render Dashboard > Environment
      # GOOGLE_MAPS_API_KEY → Render Dashboard > Environment (optional, for real routing)
