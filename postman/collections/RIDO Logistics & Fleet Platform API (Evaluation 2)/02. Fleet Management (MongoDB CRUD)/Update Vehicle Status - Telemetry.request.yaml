$kind: http-request
name: Update Vehicle Status / Telemetry
url: "{{baseUrl}}/api/fleet/{{vehicleId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
body:
  type: text
  content: |-
    {
      "status": "in-transit",
      "currentSpeed": 64,
      "batteryLevel": 88
    }
order: 4000
