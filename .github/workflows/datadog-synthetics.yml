# Datadog Synthetic CI/CD Tests — RIDO Logistics Platform
# Docs: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/
#
# SETUP (one-time):
# 1. Go to GitHub → Settings → Secrets → Actions
# 2. Add secret: DD_API_KEY  (from https://app.datadoghq.com/organization-settings/api-keys)
# 3. Add secret: DD_APP_KEY  (from https://app.datadoghq.com/organization-settings/application-keys)
# 4. Set DD_SITE below to match your Datadog region (default: datadoghq.com)

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  synthetics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Skip gracefully if Datadog secrets are not yet configured
      - name: Check Datadog secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.DD_API_KEY }}" ] || [ -z "${{ secrets.DD_APP_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️  DD_API_KEY or DD_APP_KEY not set — skipping Datadog Synthetic tests."
            echo "   Add them at: GitHub → Settings → Secrets → Actions"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Datadog secrets found — running Synthetic tests."
          fi

      # Run all Synthetic tests defined in .github/datadog-tests/
      - name: Run Datadog Synthetic tests
        if: steps.check_secrets.outputs.skip == 'false'
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          site: datadoghq.com
          files: ".github/datadog-tests/*.synthetics.json"
          fail_on_critical_errors: true
          fail_on_missing_tests: false
          fail_on_timeout: true
