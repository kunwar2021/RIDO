# This workflow will trigger Datadog Synthetic tests within your Datadog organisation
# For more information on running Synthetic tests within your GitHub workflows see: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# To get started:
# 1. Add your Datadog API (DD_API_KEY) and Application Key (DD_APP_KEY) as secrets to your GitHub repository.
#    See: https://docs.datadoghq.com/account_management/api-app-keys/
# 2. Create Synthetic tests in Datadog and tag them with 'e2e-tests' (or update test_search_query below).

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  synthetics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Skip gracefully if Datadog secrets are not yet configured
      - name: Check Datadog secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.DD_API_KEY }}" ] || [ -z "${{ secrets.DD_APP_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️  DD_API_KEY or DD_APP_KEY secret not set — skipping Datadog Synthetic tests."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Run Synthetic tests within your GitHub workflow.
      # For additional configuration options visit the action within the marketplace:
      # https://github.com/marketplace/actions/datadog-synthetics-ci
      - name: Run Datadog Synthetic tests
        if: steps.check_secrets.outputs.skip == 'false'
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'  # Update this tag to match your Datadog Synthetic test tags
