# CI — RIDO Backend Tests
# Runs on every push and PR to main.
# Tests the API endpoints and validates the codebase.

name: Backend CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      JWT_SECRET: test_jwt_secret_ci_only
      MONGODB_URI: ""   # Empty = uses in-memory fallback (no DB needed in CI)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Validate all route files load without errors
        run: node -e "require('./server.js'); console.log('✅ Server loaded OK'); process.exit(0);"
        working-directory: backend

      - name: Run API endpoint tests
        run: node ../tests/test_api_endpoints.js
        working-directory: backend
        continue-on-error: true   # Don't fail CI if live server is sleeping

      - name: Run curriculum verification
        run: node ../tests/verify_curriculum.js
        working-directory: backend
        continue-on-error: true
