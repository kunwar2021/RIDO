<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RIDO Admin - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <div class="admin-auth-wrapper">
    <div class="admin-auth-card">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">RIDO <span class="text-orange-600">Admin</span></h1>
        <p class="text-sm text-slate-500 mt-1">Control Center Access</p>
      </div>
      
      <div id="login-error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 font-medium">
        Invalid credentials. Try admin@ridosaathi.com / Admin@123
      </div>

      <form onsubmit="AdminApp.handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
          <input type="email" id="email" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" placeholder="admin@ridosaathi.com" required value="admin@ridosaathi.com">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
          <input type="password" id="password" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" placeholder="••••••••" required value="Admin@123">
        </div>
        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-lg shadow-md transition-colors mt-2">
          Login to Dashboard
        </button>
      </form>
    </div>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
